# Mod metadata. Placeholders such as the mod id are filled from gradle.properties during the build.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Evizka"
description='''
Deepwaater добавляет биом «Глубокое болото»: болото с сенотами (глубокими ямами,
заполненными подземной водой), которые соединены подземными туннелями, и огромными
болотными деревьями с глубокими корнями. Добавляет свои блоки: бревно, листву, корни,
ил и мох.
Требует TerraBlender.
'''

# Required: NeoForge itself.
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Required: Minecraft version.
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Required: TerraBlender adds biomes to the overworld climate map.
[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"
