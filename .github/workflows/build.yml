name: Build mod

on:
  push:
    branches: [ "arena/**", main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod jar
        id: build
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > build-output.log 2>&1
          code=$?
          # Surface compiler and Gradle errors as annotations so they can be read without the raw log.
          grep -E "error:|What went wrong|Execution failed|FAILED|Could not|Caused by" build-output.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore

      - name: List produced jars
        run: ls -la build/libs/

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepwaater-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/libs/*.jar --clobber
