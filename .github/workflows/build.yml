name: Build mod

on:
  push:
    branches: [ "arena/**", main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew build --no-daemon

      - name: List produced jars
        run: ls -la build/libs/

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepwaater-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/libs/*.jar --clobber
